<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#253b80"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#grad)"/>
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>
  
  <!-- Badge Accent -->
  <rect x="96" y="96" width="320" height="320" rx="64" fill="url(#accent)"/>
  
  <!-- Text / Icon -->
  <text x="256" y="256" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="200" fill="#ffffff" text-anchor="middle" dominant-baseline="central">E</text>
  
  <!-- Subtext or dot -->
  <circle cx="380" cy="140" r="24" fill="#f97316"/>
</svg>