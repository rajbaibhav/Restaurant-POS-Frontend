<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#253b80"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="0" fill="url(#grad)"/>
  
  <!-- Subtle inner border -->
  <rect x="16" y="16" width="480" height="480" rx="0" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="0"/>
  
  <!-- Badge Accent -->
  <rect x="128" y="128" width="256" height="256" rx="56" fill="url(#accent)"/>
  
  <!-- Text / Icon -->
  <text x="256" y="256" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="160" fill="#ffffff" text-anchor="middle" dominant-baseline="central">E</text>
  
  <!-- Subtext or dot -->
  <circle cx="350" cy="165" r="20" fill="#f97316"/>
</svg>